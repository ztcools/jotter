name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm check
      - name: Build bundle
        run: pnpm build
      - name: Icons are up to date with their generator
        run: |
          pnpm icons
          git diff --exit-code -- src-tauri/icons

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri-build embeds ../dist, so the bundle must exist before cargo runs.
      - run: pnpm build
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  installer:
    name: Windows installer
    needs: [frontend, rust]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build portable exe and NSIS installer
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: jotter-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/jotter.exe
            src-tauri/target/release/bundle/nsis/*.exe

  container-build:
    name: Containerised cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Cross-compile the portable exe
        run: make windows
      - uses: actions/upload-artifact@v4
        with:
          name: jotter-windows-portable
          if-no-files-found: error
          path: dist-win/Jotter.exe
