name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # The installer job only ever runs for a tag, which makes it the one job that
  # cannot be exercised without minting a public tag. This lets it be run by hand
  # against a branch (it then builds and inspects the exe, and skips publishing —
  # there is no release to attach to).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm check
      - name: Build bundle
        run: pnpm build
      - name: Icons are up to date with their generator
        run: |
          pnpm icons
          git diff --exit-code -- src-tauri/icons

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri-build embeds ../dist, so the bundle must exist before cargo runs.
      - run: pnpm build
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      # `--features custom-protocol` is what the shipped exe is built with, so it
      # is what gets linted: the feature decides tauri's `cfg(dev)`, and without
      # it clippy checks a configuration that never ships.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --features custom-protocol --all-targets -- -D warnings

  installer:
    name: Windows installer
    needs: [frontend, rust]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # Only to attach the built files to the tag's release; nothing else here
    # writes to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tauri's beforeBuildCommand (pnpm build) normally covers this, but an
      # explicit build here guarantees ../dist exists before cargo runs and
      # surfaces any frontend failure with its own step name instead of
      # burying it inside the tauri build log.
      - name: Build frontend bundle
        run: pnpm build
      - name: Build portable exe and NSIS installer
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: jotter-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/jotter.exe
            src-tauri/target/release/bundle/nsis/*.exe
      # After the upload, deliberately: if the exe misbehaves the job still fails,
      # but the binary that misbehaved is downloadable.
      #
      # What this runner can be asked for is less than it looks. Screen capture
      # needs a desktop to capture; an idle-CPU percentage on a shared runner
      # measures the neighbours; and everything the harness drives through the
      # webview needs a debugging port, which this runner will not produce — the
      # job runs elevated and the WebView2 loader there discards
      # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS wholesale (no Edge policy involved,
      # and the same exe honours it on an ordinary desktop). So this step asserts
      # what a runner can honestly answer: the exe starts, both windows exist with
      # the geometry the Rust side owes them, the mascot is on top and inside the
      # work area, the notebook starts hidden, and nothing logged an ERROR. It
      # prints the name of every check it had to leave out, and the full suite runs
      # on a desktop before a tag goes up (see README, 验收).
      - name: Acceptance (runs the exe and inspects it)
        run: >
          powershell -ExecutionPolicy Bypass -File scripts/acceptance.ps1
          -Exe src-tauri/target/release/jotter.exe -SkipPixel -SkipCpu -NoDevtools -Stop

      # Last, so a release only ever exists for a binary that was started and
      # inspected on a real Windows machine. `gh` is preinstalled on the runner —
      # no third-party action in the path that produces the download people run.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'no NSIS installer was produced' }
          $setupPath = $setup.FullName
          # `jotter.exe` is a fine build output and a poor thing to download.
          $portable = "Jotter-$tag-portable.exe"
          Copy-Item src-tauri/target/release/jotter.exe $portable
          gh release create $tag --verify-tag --title "Jotter $tag" `
            --notes-file .github/release-notes.md $setupPath $portable

  container-build:
    name: Containerised cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Cross-compile the portable exe
        run: make windows
      - uses: actions/upload-artifact@v4
        with:
          name: jotter-windows-portable
          if-no-files-found: error
          path: dist-win/Jotter.exe
