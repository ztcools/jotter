[package]
name = "jotter"
version = "0.1.1"
description = "Floating desktop scratchpad for jotting down UI and web issues"
authors = ["ztcools"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "jotter_lib"
# Desktop-only target, so the mobile-oriented staticlib/cdylib outputs the Tauri
# template ships by default are omitted — they only slow the link step here.
crate-type = ["rlib"]

[features]
# DO NOT REMOVE. `tauri`'s build script computes `dev = !custom-protocol`, and a
# dev build loads `build.devUrl` (http://localhost:1420) instead of the assets
# embedded at compile time — a shipped exe then shows the browser's
# ERR_CONNECTION_REFUSED page. The `tauri` CLI passes this on `tauri build`; our
# container build calls cargo directly, so it must pass it explicitly.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` is what lets `tray.rs` embed the tray asset at compile time.
tauri = { version = "2.5", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
log = "0.4"
tauri-plugin-log = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
